name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The engine and scripted workloads use only the standard library; replay needs numpy.
      # Model and TAMAS tests skip themselves when those are not present.
      - run: python -m pip install numpy
      - run: python -m unittest -q
